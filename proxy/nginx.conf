# ============================================================
# BATTLEPOOL — PROXY UNIFIÉ (test de viabilité Phase 1)
# ------------------------------------------------------------
# Unifie App 1 (BATTLEPOOL / Laravel) et App 2 (Web3 Combat Godot)
# sur une SEULE origine, afin que le localStorage soit partagé
# entre le portail, App 1 et App 2 (session wallet unifiée).
#
#   * /        -> App 1 (Laravel, port hôte 8001)
#                 (portail /portal + assets absolus /build, /api…)
#   * /app2/   -> App 2 frontend statique (port hôte 8080)
#                 => la PAGE d'App 2 est servie sur la même origine
#                    (localStorage partagé avec le portail + App 1)
#
# App 2 garde ses API/Reverb/RPC en absolu (hostname:8000 / 8081 / 8545) :
#   - son backend Laravel autorise CORS ['*']  => pas de blocage cross-origin
#   - la session wallet unifiée est lue dans le localStorage (origine 8090)
#
# Usage (depuis G:\DEV\PHP\rock-paper-scissors) :
#   docker run -d --name bp-proxy -p 8090:80 --add-host host.docker.internal:host-gateway \
#     -v ${PWD}/proxy/nginx.conf:/etc/nginx/conf.d/default.conf nginx:alpine
# ============================================================
server {
    listen 80;
    server_name localhost;

    # ---- Portail + App 1 (BATTLEPOOL) à la racine ----
    # App 1 exploite des chemins absolus (/build, /api, /css…)
    # => il doit rester à la racine pour que ses assets fonctionnent.
    location / {
        proxy_pass http://host.docker.internal:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- App 2 : frontend statique (Godot + portail secondaire) ----
    # Réécrit /app2/xxx -> 8080/xxx. La page est alors SAME-ORIGIN (8090)
    location /app2/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}