<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BATTLEPOOL | Portal</title>
    <meta name="theme-color" content="#0F0C1B">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DA officielle du jeu : NEO-STREET FIGHTER / URBAN ANIME POP-CYBER */
            --bg: #0F0C1B;              /* Night Violet — fond global */
            --bg-card: #1F1B2E;         /* Panel Dark — cartes/modales */
            --bg-panel-light: #2A243D;  /* Panel Light — hover/headers */
            --primary: #00E5FF;         /* Cyan Spark — Web3, badges, sélection */
            --cyan: #00E5FF;
            --purple: #7B2CBF;          /* Neon Purple — marque secondaire */
            --gold: #FFC700;            /* Electric Gold — CTA primaires */
            --gold-hover: #FF9100;
            --pink: #FF0055;            /* Vivid Magenta — notifications, HOT */
            --green: #00E676;           /* Success */
            --red: #FF1744;
            --orange: #FF9100;
            --text: #ffffff;
            --text-dim: #A099B8;
            --border: #2A243D;
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            background: radial-gradient(1200px 800px at 50% 15%, #2A243D 0%, #0F0C1B 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bg-glow {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(600px 400px at 15% 0%, rgba(123,44,191,.28), transparent 60%),
                radial-gradient(600px 400px at 85% 10%, rgba(0,229,255,.14), transparent 60%),
                radial-gradient(800px 500px at 50% 110%, rgba(255,0,85,.14), transparent 60%);
        }

        /* ===== ÉCRANS (langue → connexion → menu) ===== */
        .screen {
            position: relative; z-index: 1;
            width: 100vw; height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .screen.active { display: flex; }

        .logo {
            position: absolute; top: 2rem; left: 2rem;
            font-family: var(--font-heading);
            font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; z-index: 2;
        }
        .logo span { color: var(--cyan); text-shadow: 0 0 15px rgba(0,229,255,0.5); }

        h1 { font-family: var(--font-heading); font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; letter-spacing: 2px; text-align: center; }
        h1 .grad {
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .sub { color: var(--text-dim); margin-top: .8rem; font-size: 1rem; text-align: center; max-width: 520px; }

        /* ===== SÉLECTEUR DE LANGUE ===== */
        .lang-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            max-width: 500px; width: 90%; margin-top: 2rem;
        }
        .lang-btn {
            padding: 15px 20px; font-size: 1.1rem; font-weight: 600; font-family: inherit;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 1px solid var(--purple);
            background: rgba(31,27,46,0.85); color: #fff; cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: rgba(123,44,191,0.25);
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,229,255,0.25);
            transform: translateY(-2px);
        }

        /* ===== CONNEXION ===== */
        .auth-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            padding: 2.2rem; width: 100%; max-width: 440px; text-align: center; margin-top: 2rem;
        }
        .auth-card p { color: var(--text-dim); font-size: .9rem; margin: .6rem 0 1.4rem; }
        .btn {
            padding: .85rem 2rem; border: none; border-radius: 10px; cursor: pointer;
            font-family: var(--font-heading); font-weight: 800; font-size: .95rem; letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            color: #000;
            transition: transform .15s, box-shadow .15s, filter .15s; width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,229,255,.35); filter: brightness(1.1); }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
        .wallet-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0,229,255,.06); border: 1px solid rgba(0,229,255,.3);
            color: var(--cyan); padding: 8px 14px; border-radius: 8px;
            font-size: .85rem; font-weight: 600; margin-bottom: 1rem;
        }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

        /* ===== MENU SIMPLIFIÉ (juste retour) ===== */
        .return-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            padding: 2.5rem 2rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
            transition: transform .2s, border-color .2s, box-shadow .2s; text-align: center;
            max-width: 480px; margin-top: 2rem;
        }
        .return-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(123,44,191,.35); border-color: var(--cyan); }
        .return-card .icon { font-size: 3.5rem; }
        .return-card h2 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
        .return-card p { color: var(--text-dim); font-size: .95rem; line-height: 1.5; }
        .return-card .enter {
            padding: .9rem 2rem; border-radius: 8px; font-family: var(--font-heading); font-weight: 800; letter-spacing: 1px; font-size: .9rem;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            background: linear-gradient(90deg, var(--cyan), #00E676); color: #000; cursor: pointer;
        }
        .topbar {
            position: absolute; top: 2rem; right: 2rem; z-index: 2;
            display: flex; align-items: center; gap: 10px;
        }
        .topbar .lang-switch {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim);
            padding: 8px 12px; border-radius: 8px; font-size: .8rem; cursor: pointer; font-family: inherit;
            transition: all .2s;
        }
        .topbar .lang-switch:hover { border-color: var(--cyan); color: var(--cyan); }
        .topbar .logout-btn {
            background: rgba(255,0,85,.1); border: 1px solid rgba(255,0,85,.4); color: var(--pink);
            padding: 8px 14px; border-radius: 8px; font-size: .8rem; cursor: pointer; font-family: inherit; font-weight: 600;
            transition: all .2s;
        }
        .topbar .logout-btn:hover { background: rgba(255,0,85,.22); box-shadow: 0 0 12px rgba(255,0,85,.25); }

        /* ===== POPUP APPLICATION (iframe) ===== */
        #app-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(15,12,27,0.88); backdrop-filter: blur(8px);
        }
        #app-overlay.show { display: flex; align-items: center; justify-content: center; }
        #app-window {
            width: 96vw; height: 94vh; max-width: 1600px;
            background: #000; border: 1px solid var(--purple); border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,.6);
        }
        #app-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--purple);
        }
        #app-bar .title { font-family: var(--font-heading); font-size: .9rem; font-weight: 800; letter-spacing: 1px; }
        #app-bar .actions { display: flex; gap: 8px; }
        .bar-btn {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: .8rem;
            cursor: pointer; font-family: inherit; font-weight: 600;
        }
        .bar-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .bar-btn.close:hover { color: var(--pink); border-color: rgba(255,0,85,.5); }
        #app-frame { flex: 1; width: 100%; border: none; background: #000; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1F1B2E; border: 1px solid var(--purple); color: #fff;
            padding: 12px 22px; border-radius: 10px; font-size: .9rem; z-index: 999;
            opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center;
        }
        #toast.show { opacity: 1; }
    </style>
</head>

<!-- ===== ÉCRAN 1 : CHOIX DE LANGUE ===== -->
<div id="screen-lang" class="screen">

    <div class="lang-grid" id="lang-grid"></div>
</div>

<!-- ===== ÉCRAN 2 : CONNEXION ===== -->
<div id="screen-login" class="screen">
    <h1 data-i18n="login.title">Ready to Fight?</h1>
    <p class="sub" data-i18n="login.subtitle">Connect your wallet to enter the arena and start your session.</p>
    <div class="auth-card">
        <div class="wallet-badge" id="wallet-badge" style="display:none;">
            <span class="live-dot"></span>
            <span id="wallet-addr">0x...</span>
        </div>
        <h3 data-i18n="login.card_title" style="margin-bottom:.5rem;">Wallet Connection</h3>
        <p id="login-hint">...</p>
        <button class="btn" id="connect-btn">🦊 MetaMask</button>
    </div>
    <div class="topbar">
        <button class="lang-switch" id="lang-switch" data-i18n="login.lang_switch">🌐 Change language</button>
    </div>
</div>

<!-- ===== ÉCRAN 3 : MENU SIMPLIFIÉ (juste retour au jeu) ===== -->
<div id="screen-menu" class="screen">
    <h1 data-i18n="menu.title">BATTLE<span class="grad">POOL</span></h1>
    <p class="sub" data-i18n="menu.subtitle">Portail de jeu Battle Pool</p>
    
    <div class="return-card">
        <span class="icon">↩️</span>
        <h2 data-i18n="menu.return.title">Retour au Jeu</h2>
        <p data-i18n="menu.return.desc">Retourner à l'application principale (App 2)</p>
        <div class="enter" id="btn-return-to-game" data-i18n="menu.return">RETOUR</div>
    </div>
    
    <div class="topbar">
        <span class="wallet-badge" id="menu-wallet-badge"><span class="live-dot"></span><span id="menu-wallet-addr">0x...</span></span>
        <button class="lang-switch" id="lang-switch-2">🌐</button>
        <button class="logout-btn" id="logout-btn">🔌</button>
    </div>
</div>

<!-- ===== POPUP APPLICATION ===== -->
<div id="app-overlay">
    <div id="app-window">
        <div id="app-bar">
            <div class="title" id="app-title">BATTLEPOOL</div>
            <div class="actions">
                <button class="bar-btn" id="app-fullscreen">⛶</button>
                <button class="bar-btn close" id="app-close">✖</button>
            </div>
        </div>
        <iframe id="app-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-pointer-lock allow-downloads" loading="eager"></iframe>
    </div>
</div>

<div id="toast"></div>

        'app.title.bp': 'BATTLE POOL',
        'app.title.duel': '决斗',
        'app.title.br': '大逃杀',
    }
};

let currentLocale = 'fr';
function t(key) {
    return (TRANSLATIONS[currentLocale] && TRANSLATIONS[currentLocale][key])
        || TRANSLATIONS.en[key]
        || key;
}
function applyTranslations() {
    document.documentElement.lang = currentLocale;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerHTML = t(key); // autorise le <span class="grad"> inline
    });
    const btn = document.getElementById('connect-btn');
    if (btn) btn.textContent = t('login.connect');
}

/* ===== NAVIGATION ENTRE ÉCRANS ===== */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ===== ÉTAT ===== */
const state = { connected: false, walletAddress: null };

/* ===== DÉTECTION SESSION EXISTANTE (localStorage partagé) ===== */
function detectSession() {
    try {
        const raw = localStorage.getItem('user');
        if (raw) {
            const u = JSON.parse(raw);
            const addr = u && (u.wallet_address || u.walletAddress || u.address);
            if (addr) {
                state.walletAddress = addr.toLowerCase();
                state.connected = !!localStorage.getItem('auth_token') || !!localStorage.getItem('token');
                return true;
            }
        }
    } catch (e) { /* malformé → non connecté */ }
    return false;
}

function shortAddr(a) { return a ? a.slice(0, 6) + '...' + a.slice(-4) : '0x...'; }
function toast(msg, ms = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

/* ===== CONNEXION WALLET (flow identique à App 1) ===== */
async function connectWallet() {
    const btn = document.getElementById('connect-btn');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = t('login.connecting');

    try {
        if (typeof window.ethereum === 'undefined') {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                const cleaned = window.location.href.replace(/^https?:\/\//, '');
                window.open('https://metamask.app.link/dapp/' + cleaned, '_blank');
                toast(t('login.connecting'));
                return;
            }
            toast(t('errors.metamask'));
            return;
        }

        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const walletAddress = accounts[0];

        // 1. Challenge
        const challengeRes = await fetch('/api/wallet/generate-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ wallet_address: walletAddress })
        });
        const challengeData = await challengeRes.json();
        if (!challengeRes.ok) throw new Error(challengeData.message || t('errors.network'));
        const message = challengeData.message;

        // 2. Sign
        const signature = await window.ethereum.request({
            method: 'personal_sign',
            params: [message, walletAddress]
        });

        // 3. Verify (locale envoyé comme App 1)
        const verifyRes = await fetch('/api/wallet/verify-signature', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                wallet_address: walletAddress,
                signature: signature,
                locale: localStorage.getItem('user_locale') || currentLocale
            })
        });
        const data = await verifyRes.json();
        if (!verifyRes.ok) throw new Error(data.message || t('errors.auth'));

        // Persist session (clés identiques App 1 → partagées avec App 1 & App 2)
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('auth_token', data.token);

        state.user = data.user;
        state.walletAddress = (data.user.wallet_address || walletAddress).toLowerCase();
        state.connected = true;

        toast('✅ ' + t('login.connected'));
        render();
    } catch (error) {
        console.error('[Portal] Échec connexion :', error);
        toast('❌ ' + (error?.message || t('errors.auth')));
    } finally {
        btn.disabled = false;
        btn.textContent = t('login.connect');
    }
}

function logout() {
    localStorage.removeItem('user');
    localStorage.removeItem('auth_token');
    state.connected = false;
    state.walletAddress = null;
    toast(t('logout.done'));
    showScreen('screen-login');
    render();
}

/* ===== RENDU ===== */
function render() {
    document.getElementById('wallet-badge').style.display = state.connected ? 'flex' : 'none';
    document.getElementById('wallet-addr').textContent = shortAddr(state.walletAddress);
    document.getElementById('menu-wallet-addr').textContent = shortAddr(state.walletAddress);
    if (state.connected) {
        showScreen('screen-menu');
    } else {
        showScreen('screen-login');
        document.getElementById('login-hint').textContent = t('login.required');
    }
}

/* ===== POPUP APPLICATION (iframe) ===== */
const APP_ROUTES = {
    bp:   { url: PORTAL_CONFIG.APP1_URL,  titleKey: 'app.title.bp' },
    duel: { url: PORTAL_CONFIG.APP2_URL,  titleKey: 'app.title.duel' },
    br:   { url: PORTAL_CONFIG.APP2_URL,  titleKey: 'app.title.br' },
};

function openApp(mode) {
    const conf = APP_ROUTES[mode];
    if (!conf) return;
    if (!state.connected) { toast(t('login.required')); return; }
    document.getElementById('app-title').textContent = t(conf.titleKey);
    const frame = document.getElementById('app-frame');
    frame.src = conf.url;
    document.getElementById('app-overlay').classList.add('show');
    // Un second chargement évite le cache si l'utilisateur change de mode
    document.getElementById('app-frame').onload = null;
}
function closeApp() {
    document.getElementById('app-overlay').classList.remove('show');
    document.getElementById('app-frame').src = 'about:blank';
}
function toggleFullscreen() {
    const win = document.getElementById('app-window');
    if (!document.fullscreenElement) {
        win.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

/* ===== SÉLECTION DE LANGUE ===== */
function buildLangGrid() {
    const grid = document.getElementById('lang-grid');
    grid.innerHTML = '';
    SUPPORTED_LOCALES.forEach(lang => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.textContent = FLAGS[lang];
        btn.onclick = () => chooseLanguage(lang);
        grid.appendChild(btn);
    });
}
function chooseLanguage(lang) {
    if (!SUPPORTED_LOCALES.includes(lang)) return;
    currentLocale = lang;
    localStorage.setItem('user_locale', lang);
    applyTranslations();
    // Après choix de langue → connexion (ou menu si déjà connecté)
    render();
}

/* ===== INITIALISATION ===== */
function initLanguage() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = urlParams.get('lang');
    let savedLang = localStorage.getItem('user_locale');

    if (urlLang && SUPPORTED_LOCALES.includes(urlLang)) {
        savedLang = urlLang;
        localStorage.setItem('user_locale', urlLang);
    }
    if (savedLang && SUPPORTED_LOCALES.includes(savedLang)) {
        currentLocale = savedLang;
        applyTranslations();
        return true; // langue connue → passer à la connexion
    }
    // Pas de langue → afficher le sélecteur plein écran
    currentLocale = 'en';
    buildLangGrid();
    applyTranslations();
    showScreen('screen-lang');
    return false;
}

document.addEventListener('DOMContentLoaded', () => {
    const hasLang = initLanguage();

    // Boutons
    document.getElementById('connect-btn').addEventListener('click', connectWallet);
    document.getElementById('lang-switch').addEventListener('click', () => { buildLangGrid(); showScreen('screen-lang'); });
    document.getElementById('lang-switch-2').addEventListener('click', () => { buildLangGrid(); showScreen('screen-lang'); });
    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('app-close').addEventListener('click', closeApp);
    document.getElementById('app-fullscreen').addEventListener('click', toggleFullscreen);

    // Bouton retour vers App 2 (frontend Godot sur le même domaine)
    document.getElementById('btn-return-to-game').addEventListener('click', () => {
        if (!state.connected) {
            toast(t('login.required'));
            return;
        }
        // Redirection vers l'App 2 (même domaine, port 8080 en dev ou proxy en prod)
        window.location.href = PORTAL_CONFIG.APP2_URL || '/app2/';
    });

    // Si langue connue → connexion ou menu directement
    if (hasLang) render();

    // Sync multi-onglet
    window.addEventListener('storage', (e) => {
        if (e.key === 'user' || e.key === 'auth_token' || e.key === 'token') {
            const was = state.connected;
            detectSession();
            if (was !== state.connected) render();
        }
    });
});
</script>
</body>
</html>
