<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Wave</title>
<style>body{margin:0;background:#0f1115;color:#e7e9ee;font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#151922;border:1px solid #2b3242;border-radius:12px;padding:16px;margin:12px 0}.muted{color:#8b93a6}.err{color:#ff7a7a}.order{border-top:1px solid #2b3242;padding:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:150px 1fr;gap:5px 10px;font-size:13px}.k{color:#7c8496}.v{word-break:break-all}.status{font-size:11px;padding:2px 8px;border-radius:99px;background:#243044;color:#9ec1ff}button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;background:#4f8cff;color:#fff}button.green{background:#1f9d63}button.red{background:#b33a3a}select,input{background:#0c1420;color:#fff;border:1px solid #3a4150;border-radius:8px;padding:8px}code{color:#9ec1ff}a{color:#6ea8fe}</style></head><body><div class="wrap">
<h1>Admin Wave</h1><p class="muted">Wave Côte d’Ivoire · XOF ↔ USDT Polygon · MVP manuel · <a href="/admin/onramp.html">On-ramp</a> · <a href="/admin/offramp.html">Off-ramp</a></p>
<div class="card"><label>Filtre statut</label> <select id="status"><option value="">Tous</option><option>pending_payment</option><option>pending_deposit</option><option>pending_review</option><option>paid</option><option>rejected</option><option>expired</option></select> <button id="refresh">Rafraîchir</button> <span id="msg" class="muted"></span></div>
<div id="orders"></div>
<script>
const $=id=>document.getElementById(id);const token=localStorage.getItem('auth_token');const user=JSON.parse(localStorage.getItem('user')||'null');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=extra=>token?{...extra,'Authorization':'Bearer '+token}:extra;
async function api(p,o={}){const r=await fetch(p,{...o,headers:H(o.headers||{})});if(r.status===401)throw new Error('Session expirée');if(r.status===403)throw new Error('Admin requis');const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||('HTTP '+r.status));return d;}
const badge=s=>`<span class="status">${esc(s)}</span>`;
function render(o){const buy=o.direction==='buy_usdt';const can=o.status==='pending_review';return `<div class="order card"><div class="row"><b>${esc(o.reference)}</b>${badge(o.status)}<span class="muted">${buy?'Wave → USDT':'USDT → Wave'} · #${o.id} · MobileCrypto #${o.mobile_user_id}${o.full_name?` · ${esc(o.full_name)}`:""}</span><span style="flex:1"></span>${can?`<button class="green" data-act="paid" data-id="${o.id}" data-dir="${o.direction}">Marquer payé</button>`:''}${!['paid','rejected'].includes(o.status)?`<button class="red" data-act="reject" data-id="${o.id}">Refuser</button>`:''}</div><div class="grid" style="margin-top:8px">
<div class="k">Montant</div><div class="v">${buy?`<b>${esc(o.fiat_amount)} XOF</b> → <b>${esc(o.usdt_amount)} USDT</b>`:`<b>${esc(o.usdt_amount)} USDT</b> → <b>${esc(o.fiat_amount)} XOF</b>`} · taux ${esc(o.rate)} · frais ${esc(o.fee_percent)}%</div>
<div class="k">Wallet USDT</div><div class="v"><code>${esc(o.wallet||'')}</code></div>
<div class="k">Téléphone</div><div class="v">${esc(buy?(o.payment_phone||''):(o.payout_phone||''))}</div>
<div class="k">Lien Wave</div><div class="v">${o.payment_url?`<a href="${esc(o.payment_url)}" target="_blank" rel="noopener">Ouvrir le lien</a>`:'—'}</div>
<div class="k">Preuve Wave</div><div class="v">${esc(o.payment_ref||'—')}</div>
<div class="k">Dépôt USDT</div><div class="v">${o.usdt_deposit_tx_hash?`<code>${esc(o.usdt_deposit_tx_hash)}</code>`:'—'}</div>
<div class="k">Payout USDT</div><div class="v">${o.usdt_payout_tx_hash?`<code>${esc(o.usdt_payout_tx_hash)}</code>`:'—'}</div>
<div class="k">Réf. paiement XOF</div><div class="v">${esc(o.fiat_tx_ref||'—')}</div>
<div class="k">Créé</div><div class="v">${esc(o.created_at||'')}</div></div></div>`;}
async function load(){try{$('msg').textContent='Chargement…';const q=$('status').value;const d=await api('/api/admin/wave/orders'+(q?'?status='+encodeURIComponent(q):''));$('orders').innerHTML=d.orders.length?d.orders.map(render).join(''):'<div class="card muted">Aucune commande.</div>';$('msg').textContent='';}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
$('refresh').onclick=load;$('status').onchange=load;
$('orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const id=b.dataset.id,act=b.dataset.act;try{b.disabled=true;if(act==='reject'){const reason=prompt('Motif du refus :')||'Refusée';await api(`/api/admin/wave/orders/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});}else{const buy=b.dataset.dir==='buy_usdt';const val=prompt(buy?'Hash de paiement USDT (Polygon) :':'Référence du paiement mobile money :');if(!val)return;const body=buy?{usdt_payout_tx_hash:val,note:'Payé admin'}:{fiat_tx_ref:val,note:'Payé admin'};await api(`/api/admin/wave/orders/${id}/paid`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}await load();}catch(err){alert(err.message);b.disabled=false;}});
if(!token||!user||!user.is_admin){$('orders').innerHTML='<div class="card err">Connecte-toi avec un compte admin dans l’app.</div>';}else load();
</script></div></body></html>
