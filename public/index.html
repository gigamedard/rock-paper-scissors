<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethereumjs-util/7.1.5/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.8.0/web3.min.js"></script>
  <script src="https://bundle.run/secp256k1@4.0.3"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111827;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .page {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: flex;
        }
        .card {
            background: #1f2937;
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 320px;
            max-width: 400px;
            border: 1px solid #374151;
        }
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        p {
            color: #9ca3af;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 1rem;
        }
        button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #374151;
            cursor: not-allowed;
            transform: none;
        }
        .flag-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .flag-btn {
            background: none;
            border: 2px solid #4b5563;
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
        }
        .flag-btn:hover {
            border-color: #6366f1;
            transform: scale(1.05);
        }
        .flag-btn img {
            width: 100%;
            display: block;
        }
        #user-info {
            color: #d1d5db;
            margin-bottom: 1.5rem;
        }
        .logout-btn {
            background: #9ca3af;
            color: #111827;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Add this CSS to your existing <style> block */
        #referral-code-input {
            width: 100%;
            padding: 12px;
            margin-top: 1.5rem;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background-color: #374151;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        .skip-btn {
            background: none;
            border: 1px solid #4b5563;
            margin-top: 0.5rem;
        }
        .skip-btn:hover {
            background: #374151;
        }
    </style>
</head>
<body>

    <div id="language-page" class="page">
        <div class="card">
            <h2>Choose Your Language</h2>
            <p>Select a language to connect your wallet and start playing.</p>
            <div class="flag-container">
                <button class="flag-btn" onclick="loginWithWallet('en')"><img src="flags/en.png" alt="English"></button>
                <button class="flag-btn" onclick="loginWithWallet('fr')"><img src="flags/fr.png" alt="Français"></button>
                <button class="flag-btn" onclick="loginWithWallet('es')"><img src="flags/es.png" alt="Español"></button>
                <button class="flag-btn" onclick="loginWithWallet('de')"><img src="flags/de.png" alt="Deutsch"></button>
                <button class="flag-btn" onclick="loginWithWallet('pt')"><img src="flags/pt.png" alt="Português"></button>
                <button class="flag-btn" onclick="loginWithWallet('zh')"><img src="flags/zh.png" alt="中文"></button>
            </div>
        </div>
    </div>

    <div id="autoplay-page" class="page">
        <div class="card">
            <h2>Autoplay Active</h2>
            <p id="user-info">Loading user data...</p>
            <button id="autoplay-btn" onclick="startAutoplay()">Start Game</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="referral-page" class="page">
        <div class="card">
            <h2>Have a Referral Code?</h2>
            <p>Enter a referral code to get a bonus. You can also skip this step.</p>
            
            <input type="text" id="referral-code-input" placeholder="e.g., REF-ABC123">
            
            <button id="submit-referral-btn" onclick="submitReferralCode()">Continue</button>
            <button class="skip-btn" onclick="submitReferralCode(true)">Skip for Now</button>
        </div>
    </div>
    
    <script>
        // --- 1. Variables Globales et Initialisation ---
        const API_URL = 'http://127.0.0.1:8000/api';
        const PINATA_API_KEY = 'TA_CLE_PINATA'; // Placeholder
        const PINATA_API_SECRET = 'TON_SECRET_PINATA'; // Placeholder
        const PINATA_API_URL = 'https://api.pinata.cloud/pinning/pinJSONToIPFS';

        let web3;
        let gameContract;

        const gameState = {
            selectedMoves: [],
            selectedBet: 0.05 // Valeur par défaut de la mise
        };

        const userState = {
            id: null,
            walletAddress: null
        };

        let contractConfig = {
            abi: null,
            address: null,
            securityCoefficient: 1000
        };

        // --- Fonctions utilitaires ---

        // Fonction pour un appel d'API sécurisé avec Bearer Token
        async function secureFetch(url, options = {}) {
            const token = localStorage.getItem('auth_token');
            if (!token) throw new Error("Authentication token not found. Please log in.");

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };

            return fetch(url, { ...options, headers });
        }

        // Gère l'affichage des pages/modals
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- 2. Fonction d'Initialisation de la Page de Jeu ---
        async function initializeGamePage() {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('auth_token');

            if (!user || !token) {
                console.error("User not logged in. Redirecting to login.");
                logout();
                return;
            }

            // 2.1 Charger userState
            userState.id = user.id;
            userState.walletAddress = user.wallet_address;
            document.getElementById('user-info').textContent = `Welcome, ${user.name} (${user.wallet_address.substring(0, 6)}...)`;

            // 2.2 Initialiser web3 (si ce n'est pas déjà fait)
            if (!web3 && window.ethereum) {
                web3 = new Web3(window.ethereum);
            } else if (!web3) {
                console.error("MetaMask or Web3 provider not detected.");
                return;
            }

            // 2.3 Appeler l'API Laravel sur la route sécurisée GET /api/artefacts
            try {
                const response = await secureFetch(`${API_URL}/artefacts`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.message || "Failed to load contract artefacts.");

                // 2.4 Stocker l'ABI, l'adresse et le securityCoefficient
                contractConfig.abi = data.abi;
                contractConfig.address = data.address;
                contractConfig.securityCoefficient = data.security_coefficient || 1000;

                // 2.5 Initialiser l'instance gameContract de Web3
                gameContract = new web3.eth.Contract(contractConfig.abi, contractConfig.address);
                console.log("Game contract initialized successfully.");

            } catch (error) {
                console.error("Error during game page initialization:", error);
                alert("Failed to initialize game. Please try again.");
            }
        }

        // Fonction principale de connexion au portefeuille
         async function loginWithWallet(locale) {
            console.log(`Starting login with locale: ${locale}`);
            if (!window.ethereum) {
                alert('Please install a wallet like MetaMask!');
                return;
            }

            const web3 = new Web3(window.ethereum);

            try {
                // 1. Connect wallet
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const accounts = await web3.eth.getAccounts();
                const walletAddress = accounts[0];

                console.log(`Wallet connected: ${walletAddress}`);

                // 2. Request challenge message
                const messageResponse = await fetch(`${API_URL}/wallet/generate-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wallet_address: walletAddress, locale: locale }),
                });

                if (!messageResponse.ok) throw new Error('Failed to get challenge from server.');
                const { message } = await messageResponse.json();

                // 3. Sign challenge
                const signature = await web3.eth.personal.sign(message, walletAddress);

                // 4. Verify signature & login
                const verifyResponse = await fetch(`${API_URL}/wallet/verify-signature`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wallet_address: walletAddress, signature: signature, locale: locale }),
                });

                const data = await verifyResponse.json();

                if (verifyResponse.ok && data.token) {
                    // Store token + user info
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('locale', data.locale);

                    console.log("===================== received token :",data.token);

                    updateUserInfo(data.user);

                    // 5. Check for referral code in URL
                    const params = new URLSearchParams(window.location.search);
                    const refCode = params.get('ref');

                    if (refCode) {
                        console.log(`Found referral code in URL: ${refCode}`);
                        await applyReferralCodeFromUrl(refCode, data.token);
                    }

                    // 5. Redirection vers la page appropriée
		            const user = JSON.parse(localStorage.getItem('user'));
		            if (user && user.referral_code) {
		                showPage('autoplay-page');
		                initializeGamePage();
		            } else {
		                // If no referral code → show referral modal
		                showPage('referral-page');
		            }
                } else {
                    throw new Error(data.message || 'Signature verification failed.');
                }
            } catch (error) {
                console.error('Authentication Error:', error);
                alert(`Login failed: ${error.message}`);
            }
        }
        
        // helper function to auto-apply referral
        async function applyReferralCodeFromUrl(refCode, token) {
            try {

                
                const response = await fetch(`${API_URL}/user/set-referral`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ referral_code: refCode})
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Referral code applied automatically!');
                    // Jump straight to autoplay since referral was handled
                    showPage('autoplay-page');
                } else {
                    console.warn(`Referral not applied: ${data.message}`);
                    // Still proceed to referral modal if code failed
		                    showPage('referral-page');
                }
            } catch (err) {
                console.error('Error applying referral from URL:', err);
                showPage('referral-page');
            }
        }


        // --- 3. Logique de Soumission Principale (Le Flux Complet) ---
        async function handleSubmitPremove() {
            if (!gameContract) {
                alert("Game not initialized. Please refresh the page.");
                return;
            }

            // 3.1 Concept 1 : Calcul du Budget
            const baseBetWei = web3.utils.toWei(gameState.selectedBet.toString(), 'ether');
            // Multiplie par le coefficient de sécurité (ex: 1000 pour 1000x)
            const depositAmountWei = web3.utils.toBN(baseBetWei).mul(web3.utils.toBN(contractConfig.securityCoefficient));

            console.log(`Base Bet (Wei): ${baseBetWei}`);
            console.log(`Deposit Amount (Wei): ${depositAmountWei.toString()}`);

            try {
                // 3.2 Concept 2 : Upload Pinata
                const cid = await uploadMovesToPinata(gameState.selectedMoves);
                console.log(`Pinata CID: ${cid}`);

                // 3.3 Concept 3 : Soumission au Backend (Avec User ID)
                await submitPreMovesToBackend(gameState.selectedMoves, cid);
                console.log("Pre-moves submitted to backend successfully.");

                // 3.4 Concept 4 : Soumission à la Blockchain
                await submitToBlockchain(baseBetWei, cid, depositAmountWei);
                console.log("Transaction sent to blockchain successfully.");

                alert("Game submitted! Check MetaMask for transaction status.");

            } catch (error) {
                console.error("Full submission failed:", error);
                alert(`Submission failed: ${error.message}`);
            }
        }

        // Concept 2 Helper: Upload Pinata
        async function uploadMovesToPinata(moves) {
            const pinataData = {
                pinataContent: {
                    user_id: userState.id,
                    wallet_address: userState.walletAddress,
                    moves: moves,
                    timestamp: new Date().toISOString()
                },
                pinataMetadata: {
                    name: `Pre-Move-${userState.id}-${Date.now()}`
                }
            };

            const response = await fetch(PINATA_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'pinata_api_key': PINATA_API_KEY,
                    'pinata_secret_api_key': PINATA_API_SECRET
                },
                body: JSON.stringify(pinataData)
            });

            const data = await response.json();
            if (!response.ok || !data.IpfsHash) {
                throw new Error(data.error || "Pinata upload failed.");
            }

            return data.IpfsHash;
        }

        // Concept 3 Helper: Soumission au Backend
        async function submitPreMovesToBackend(moves, cid) {
            const body = {
                user_id: userState.id,
                pre_moves: moves,
                cid: cid,
                bet_amount: gameState.selectedBet
            };

            const response = await secureFetch(`${API_URL}/user/pre-moves`, {
                method: 'POST',
                body: JSON.stringify(body)
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || "Backend submission failed.");
            }
        }

        // Concept 4 Helper: Soumission à la Blockchain
        async function submitToBlockchain(baseBetWei, cid, depositAmountWei) {
            // Remarque: web3.eth.Contract.methods.call() est utilisé pour les appels en lecture seule
            // Pour une transaction, on utilise .send()
            const tx = gameContract.methods.submitPremoveCID(
                baseBetWei,
                cid
            ).send({
                from: userState.walletAddress,
                value: depositAmountWei.toString()
            });

            // L'utilisateur devra confirmer dans MetaMask. On attend la transaction.
            return tx;
        }

        // --- Fonctions existantes modifiées/nettoyées ---

        // Fonction de démarrage du jeu (maintenant un alias pour la soumission)
        async function startAutoplay() {
            // Ici, on pourrait ajouter la logique pour sélectionner les moves,
            // mais pour l'instant, on utilise juste le placeholder.
            // Pour le test, on va simuler un move sélectionné.
            gameState.selectedMoves = [1, 2, 3]; // Exemple de moves
            await handleSubmitPremove();
        }

        
        // Déconnexion de l'utilisateur
        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            localStorage.removeItem('locale');
            alert("You have been logged out.");
            showPage('language-page');
        }

        // Met à jour l'affichage des informations utilisateur
        function updateUserInfo(user) {
            const userInfoElement = document.getElementById('user-info');
            if (user && userInfoElement) {
                const shortAddress = `${user.wallet_address.substring(0, 6)}...${user.wallet_address.substring(user.wallet_address.length - 4)}`;
                userInfoElement.textContent = `Welcome, ${user.name} (${shortAddress})`;
            }
        }

        function checkForReferralCodeInUrl() {
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');
            if (refCode) {
                const inputElement = document.getElementById('referral-code-input');
                inputElement.value = refCode;
                console.log(`Referral code '${refCode}' found in URL.`);
            }
        }

        // New function to handle submitting the referral code
        async function submitReferralCode(skipped = false) {
            const token = localStorage.getItem('auth_token');
            const inputElement = document.getElementById('referral-code-input');
            const referralCode = inputElement.value;

            // Only make an API call if the user entered a code and didn't skip
            if (!skipped && referralCode.trim() !== '' && token) {
                console.log(`Submitting referral code: ${referralCode}`);
                try {
                    const response = await fetch(`${API_URL}/user/set-referral`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ referral_code: referralCode })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        // Inform the user if the code is invalid, but continue anyway
                        alert(`Note: ${data.message}`);
                    } else {
                        alert('Referral code accepted!');
                    }
                } catch (error) {
                    console.error('Failed to submit referral code:', error);
                    // Don't block the user, just log the error
                }
            }

            // Finally, proceed to the game page
            showPage('autoplay-page');
            initializeGamePage(); // Initialiser la page de jeu après la reconnexion
        }

        // Logique de démarrage de l'application
        document.addEventListener('DOMContentLoaded', () => {
            // Add this line to check the URL as soon as the page loads
            checkForReferralCodeInUrl();

            const token = localStorage.getItem('auth_token');
            const user = JSON.parse(localStorage.getItem('user'));
            
            // The rest of this function stays the same
            if (token && user) {
                console.log("Existing session found. Welcome back!");
                updateUserInfo(user);
                showPage('autoplay-page');
                initializeGamePage(); // Initialiser la page de jeu après la reconnexion
                
            } else {
                console.log("No active session. Please log in.");
                showPage('language-page');
            }
        });

    </script>

</body>
</html>
