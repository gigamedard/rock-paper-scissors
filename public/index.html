<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethereumjs-util/7.1.5/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.8.0/web3.min.js"></script>
  <script src="https://bundle.run/secp256k1@4.0.3"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111827;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .page {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: flex;
        }
        .card {
            background: #1f2937;
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 320px;
            max-width: 400px;
            border: 1px solid #374151;
        }
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        p {
            color: #9ca3af;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 1rem;
        }
        button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #374151;
            cursor: not-allowed;
            transform: none;
        }
        .flag-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .flag-btn {
            background: none;
            border: 2px solid #4b5563;
            padding: 0;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
        }
        .flag-btn:hover {
            border-color: #6366f1;
            transform: scale(1.05);
        }
        .flag-btn img {
            width: 100%;
            display: block;
        }
        #user-info {
            color: #d1d5db;
            margin-bottom: 1.5rem;
        }
        .logout-btn {
            background: #9ca3af;
            color: #111827;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Add this CSS to your existing <style> block */
        #referral-code-input {
            width: 100%;
            padding: 12px;
            margin-top: 1.5rem;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background-color: #374151;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        .skip-btn {
            background: none;
            border: 1px solid #4b5563;
            margin-top: 0.5rem;
        }
        .skip-btn:hover {
            background: #374151;
        }
    </style>
</head>
<body>

    <div id="language-page" class="page">
        <div class="card">
            <h2>Choose Your Language</h2>
            <p>Select a language to connect your wallet and start playing.</p>
            <div class="flag-container">
                <button class="flag-btn" onclick="loginWithWallet('en')"><img src="flags/en.png" alt="English"></button>
                <button class="flag-btn" onclick="loginWithWallet('fr')"><img src="flags/fr.png" alt="Français"></button>
                <button class="flag-btn" onclick="loginWithWallet('es')"><img src="flags/es.png" alt="Español"></button>
                <button class="flag-btn" onclick="loginWithWallet('de')"><img src="flags/de.png" alt="Deutsch"></button>
                <button class="flag-btn" onclick="loginWithWallet('pt')"><img src="flags/pt.png" alt="Português"></button>
                <button class="flag-btn" onclick="loginWithWallet('zh')"><img src="flags/zh.png" alt="中文"></button>
            </div>
        </div>
    </div>

    <div id="autoplay-page" class="page">
        <div class="card">
            <h2>Autoplay Active</h2>
            <p id="user-info">Loading user data...</p>
            <button id="autoplay-btn" onclick="startAutoplay()">Start Game</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="referral-page" class="page">
        <div class="card">
            <h2>Have a Referral Code?</h2>
            <p>Enter a referral code to get a bonus. You can also skip this step.</p>
            
            <input type="text" id="referral-code-input" placeholder="e.g., REF-ABC123">
            
            <button id="submit-referral-btn" onclick="submitReferralCode()">Continue</button>
            <button class="skip-btn" onclick="submitReferralCode(true)">Skip for Now</button>
        </div>
    </div>
    
    <script>
        // URL de base de votre API Laravel
        const API_URL = 'http://127.0.0.1:8000/api';

        // Gère l'affichage des pages/modals
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Fonction principale de connexion au portefeuille
         async function loginWithWallet(locale) {
    console.log(`Starting login with locale: ${locale}`);
    if (!window.ethereum) {
        alert('Please install a wallet like MetaMask!');
        return;
    }

    const web3 = new Web3(window.ethereum);

    try {
        // 1. Connect wallet
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        const accounts = await web3.eth.getAccounts();
        const walletAddress = accounts[0];

        console.log(`Wallet connected: ${walletAddress}`);

        // 2. Request challenge message
        const messageResponse = await fetch(`${API_URL}/wallet/generate-message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet_address: walletAddress, locale: locale }),
        });

        if (!messageResponse.ok) throw new Error('Failed to get challenge from server.');
        const { message } = await messageResponse.json();

        // 3. Sign challenge
        const signature = await web3.eth.personal.sign(message, walletAddress);

        // 4. Verify signature & login
        const verifyResponse = await fetch(`${API_URL}/wallet/verify-signature`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet_address: walletAddress, signature: signature, locale: locale }),
        });

        const data = await verifyResponse.json();

        if (verifyResponse.ok && data.token) {
            // Store token + user info
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('locale', data.locale);

            console.log("===================== received token :",data.token);

            updateUserInfo(data.user);

            // 5. Check for referral code in URL
            const params = new URLSearchParams(window.location.search);
            const refCode = params.get('ref');

            if (refCode) {
                console.log(`Found referral code in URL: ${refCode}`);
                await applyReferralCodeFromUrl(refCode, data.token);
            }

            // If no referral code → show referral modal
            showPage('referral-page');
        } else {
            throw new Error(data.message || 'Signature verification failed.');
        }
    } catch (error) {
        console.error('Authentication Error:', error);
        alert(`Login failed: ${error.message}`);
    }
}
        
        // helper function to auto-apply referral
        async function applyReferralCodeFromUrl(refCode, token) {
            try {

                
                const response = await fetch(`${API_URL}/user/set-referral`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ referral_code: refCode})
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Referral code applied automatically!');
                    // Jump straight to autoplay since referral was handled
                    showPage('autoplay-page');
                } else {
                    console.warn(`Referral not applied: ${data.message}`);
                    // Still proceed to referral modal if code failed
                    showPage('referral-page');
                }
            } catch (err) {
                console.error('Error applying referral from URL:', err);
                showPage('referral-page');
            }
        }


        // Simule le démarrage d'une partie en appelant une route protégée
        async function startAutoplay() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                alert("You are not logged in.");
                return;
            }
            
            alert("Starting game... (This is a placeholder for a real API call)");
            
            // Exemple d'appel à une future route protégée
            /*
            try {
                const response = await fetch(`${API_URL}/autoplay/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message);
                alert(`Game result: ${JSON.stringify(result)}`);
            } catch (error) {
                console.error('Autoplay Error:', error);
                alert(`Could not start game: ${error.message}`);
            }
            */
        }
        
        // Déconnexion de l'utilisateur
        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            localStorage.removeItem('locale');
            alert("You have been logged out.");
            showPage('language-page');
        }

        // Met à jour l'affichage des informations utilisateur
        function updateUserInfo(user) {
            const userInfoElement = document.getElementById('user-info');
            if (user && userInfoElement) {
                const shortAddress = `${user.wallet_address.substring(0, 6)}...${user.wallet_address.substring(user.wallet_address.length - 4)}`;
                userInfoElement.textContent = `Welcome, ${user.name} (${shortAddress})`;
            }
        }

        function checkForReferralCodeInUrl() {
    const params = new URLSearchParams(window.location.search);
    const refCode = params.get('ref');
    if (refCode) {
        const inputElement = document.getElementById('referral-code-input');
        inputElement.value = refCode;
        console.log(`Referral code '${refCode}' found in URL.`);
    }
}

        // New function to handle submitting the referral code
        async function submitReferralCode(skipped = false) {
            const token = localStorage.getItem('auth_token');
            const inputElement = document.getElementById('referral-code-input');
            const referralCode = inputElement.value;

            // Only make an API call if the user entered a code and didn't skip
            if (!skipped && referralCode.trim() !== '' && token) {
                console.log(`Submitting referral code: ${referralCode}`);
                try {
                    const response = await fetch(`${API_URL}/user/set-referral`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ referral_code: referralCode })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        // Inform the user if the code is invalid, but continue anyway
                        alert(`Note: ${data.message}`);
                    } else {
                        alert('Referral code accepted!');
                    }
                } catch (error) {
                    console.error('Failed to submit referral code:', error);
                    // Don't block the user, just log the error
                }
            }

            // Finally, proceed to the game page
            showPage('autoplay-page');
        }

        // Logique de démarrage de l'application
        document.addEventListener('DOMContentLoaded', () => {
            // Add this line to check the URL as soon as the page loads
            checkForReferralCodeInUrl();

            const token = localStorage.getItem('auth_token');
            const user = JSON.parse(localStorage.getItem('user'));
            
            // The rest of this function stays the same
            if (token && user) {
                console.log("Existing session found. Welcome back!");
                updateUserInfo(user);
                showPage('autoplay-page'); // If already logged in, skip referral check
            } else {
                console.log("No active session. Please log in.");
                showPage('language-page');
            }
        });

    </script>

</body>
</html>
