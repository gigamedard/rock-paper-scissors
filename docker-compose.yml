services:

  # ============================================================
  # 1. BASE DE DONNÉES (MySQL)
  # ============================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rock_paper_scissors
      MYSQL_ROOT_PASSWORD: ***REMOVED***
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # 3307 hôte pour ne pas entrer en conflit avec l'autre app (3306)
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p***REMOVED***"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ============================================================
  # 2. CACHE & QUEUE (Redis)
  # ============================================================
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # 3. MIGRATIONS (One-shot — s'éteint après succès)
  # Utilise l'image app déjà buildée — pas de rebuild Composer.
  # ============================================================
  init-db:
    image: rock-paper-scissors-app:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /var/www/html &&
        echo "Attente de la base de données..." &&
        until php -r "new PDO('mysql:host=db;dbname=rock_paper_scissors', 'root', '***REMOVED***');" 2>/dev/null; do sleep 2; done;
        echo "Base de données prête !" &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        echo '✅ Migrations terminées.'
    env_file: .env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # 4. BLOCKCHAIN (Hardhat + Deploy des Smart Contracts)
  # Image rebuildée avec le nouveau entrypoint.sh + deployed.txt
  # ============================================================
  blockchain:
    image: rock-paper-scissors-blockchain:latest
    restart: unless-stopped
    ports:
      # 8546 hôte pour ne pas entrer en conflit avec l'autre app (8545)
      - "8546:8545"
    volumes:
      # Permet à full_deploy.js d'écrire les nouvelles adresses dans config.js (sur le host)
      - ./smart_contracts:/smart_contracts
    healthcheck:
      # Vérifie que le déploiement des contrats est terminé
      test: ["CMD", "test", "-f", "/app/deployed.txt"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # ============================================================
  # 5. BRIDGE NODE.JS (Listener Smart Contracts + API interne)
  # Démarre UNIQUEMENT après que blockchain soit healthy.
  # Reçoit les adresses fraîches via le volume partagé smart_contracts/
  # ============================================================
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rock-paper-scissors-bridge:latest
    command: ["node", "smart_contracts/app.js"]
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      # CRUCIAL : Monter UNIQUEMENT config.js (pas tout le dossier).
      # Monter tout smart_contracts/ écraserait les node_modules Linux avec ceux de Windows.
      - ./smart_contracts/config.js:/app/smart_contracts/config.js:ro
    depends_on:
      blockchain:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ============================================================
  # 6. APPLICATION LARAVEL (PHP + Nginx + Frontend)
  # Démarre après les migrations ET que le bridge soit ready
  # ============================================================
  app:
    build: .
    image: rock-paper-scissors-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8080"]
    ports:
      # 8001 hôte pour ne pas entrer en conflit avec l'autre app (8000)
      - "8001:8080"
    env_file: .env.staging
    depends_on:
      init-db:
        condition: service_completed_successfully
      bridge:
        condition: service_healthy

  # ============================================================
  # 7. SERVEUR WEBSOCKET (Laravel Reverb)
  # Démarre après les migrations (il lit la table cache)
  # ============================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: rock-paper-scissors-reverb:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8008"]
    restart: unless-stopped
    ports:
      - "8008:8008"
    env_file: .env.staging
    # Le serveur WebSocket Reverb est opérationnel (confirmé dans les logs).
    # L'image serversideup n'expose pas de tool TCP simple, on désactive le healthcheck.
    healthcheck:
      disable: true
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ============================================================
  # 8. WORKER BATCH (Node.js — Run Batch Processor)
  # ============================================================
  worker:
    image: rock-paper-scissors-worker:latest
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      # Monter UNIQUEMENT config.js pour ne pas écraser les node_modules Linux
      - ./smart_contracts/config.js:/app/smart_contracts/config.js:ro
    depends_on:
      bridge:
        condition: service_healthy

  # ============================================================
  # 9. QUEUE WORKER LARAVEL (Traitement des jobs async)
  # Dépend des migrations pour que les tables jobs/ batches existent
  # ============================================================
  queue-worker:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    # Désactive le healthcheck Nginx interne de l'image serversideup
    healthcheck:
      disable: true
    depends_on:
      init-db:
        condition: service_completed_successfully

  # Dedicated worker for the 'limits' queue: prevents slow/failing blockchain
  # sync jobs (SyncUserLimitsJob) from blocking real-time broadcast events
  # (FightResult, UserBalanceUpdated, ...) on the 'default' queue.
  queue-worker-limits:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--queue=limits", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    healthcheck:
      disable: true
    depends_on:
      init-db:
        condition: service_completed_successfully

# ============================================================
# VOLUMES PERSISTANTS (survivent aux docker-compose down)
# Pour tout effacer : docker-compose down -v
# ============================================================
volumes:
  db_data:
