services:

  # ============================================================
  # 1. BASE DE DONNÉES (MySQL)
  # ============================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # SECURITY: root password read from Docker secret (not env var)
    # db-entrypoint.sh reads /run/secrets/mysql_password and sets MYSQL_ROOT_PASSWORD
    # before delegating to the official MySQL entrypoint.
    entrypoint: ["/usr/local/bin/db-entrypoint.sh"]
    secrets:
      - mysql_password
    environment:
      MYSQL_DATABASE: rock_paper_scissors
      # MYSQL_ROOT_PASSWORD is set by db-entrypoint.sh from the Docker secret
    volumes:
      - db_data:/var/lib/mysql
      - ./db-entrypoint.sh:/usr/local/bin/db-entrypoint.sh:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$(cat /run/secrets/mysql_password)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ============================================================
  # 2. CACHE & QUEUE (Redis)
  # ============================================================
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # 3. MIGRATIONS (One-shot — s'éteint après succès)
  # Creates a dedicated MySQL user (rps_app) with limited privileges.
  # ============================================================
  init-db:
    image: rock-paper-scissors-app:latest
    restart: "no"
    entrypoint: ["/usr/local/bin/security-entrypoint.sh", "/bin/sh", "-c"]
    command:
      - |
        cd /var/www/html &&
        echo "Attente de la base de données..." &&
        until php -r "new PDO('mysql:host=db;dbname=rock_paper_scissors', 'root', getenv('MYSQL_PASSWORD'));" 2>/dev/null; do sleep 2; done;
        echo "Base de données prête !" &&
        echo "Creating dedicated MySQL user rps_app..." &&
        php -r '
          $$pdo = new PDO("mysql:host=db", "root", getenv("MYSQL_PASSWORD"));
          $$pdo->exec("CREATE USER IF NOT EXISTS \"rps_app\"@\"%\" IDENTIFIED BY \"" . getenv("DB_APP_PASSWORD") . "\"");
          $$pdo->exec("GRANT ALL PRIVILEGES ON rock_paper_scissors.* TO \"rps_app\"@\"%\"");
          $$pdo->exec("FLUSH PRIVILEGES");
          echo "User rps_app created.\n";
        ' &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        echo '✅ Migrations terminées.'
    env_file: .env.staging
    secrets:
      - app_key
      - mysql_password
      - internal_api_secret
      - reverb_app_key
      - reverb_app_secret
      - db_app_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # 4. BLOCKCHAIN (Hardhat + Deploy des Smart Contracts)
  # ============================================================
  blockchain:
    image: rock-paper-scissors-blockchain:latest
    restart: unless-stopped
    secrets:
      - game_wallet_pk
      - signer_wallet_pk
      - payout_operator_pk
    ports:
      - "127.0.0.1:8546:8545"
    volumes:
      - ./smart_contracts:/smart_contracts
    healthcheck:
      test: ["CMD", "test", "-f", "/app/deployed.txt"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 600s

  # ============================================================
  # 5. BRIDGE NODE.JS (Listener Smart Contracts + API interne)
  # ============================================================
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rock-paper-scissors-bridge:latest
    command: ["node", "smart_contracts/app.js"]
    restart: unless-stopped
    env_file: .env.staging
    secrets:
      - payout_operator_pk
      - marketplace_wallet_pk
      - signer_wallet_pk
      - internal_api_secret
      - db_app_password
    volumes:
      - ./smart_contracts/config.js:/app/smart_contracts/config.js:ro
    depends_on:
      blockchain:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ============================================================
  # 6. APPLICATION LARAVEL (PHP + Nginx + Frontend)
  # ============================================================
  app:
    build: .
    image: rock-paper-scissors-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:8001:8080"
    env_file: .env.staging
    secrets:
      - app_key
      - mysql_password
      - db_app_password
      - internal_api_secret
      - reverb_app_key
      - reverb_app_secret
    depends_on:
      init-db:
        condition: service_completed_successfully
      bridge:
        condition: service_healthy

  # ============================================================
  # 7. SERVEUR WEBSOCKET (Laravel Reverb)
  # ============================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: rock-paper-scissors-reverb:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8008"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    env_file: .env.staging
    secrets:
      - app_key
      - mysql_password
      - db_app_password
      - internal_api_secret
      - reverb_app_key
      - reverb_app_secret
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:8008/apps/rps_app_id/channels?auth_key=$(cat /run/secrets/reverb_app_key)&auth_timestamp=9999999999&auth_signature=test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ============================================================
  # 8. QUEUE WORKER LARAVEL (Traitement des jobs async)
  # ============================================================
  queue-worker:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    secrets:
      - app_key
      - mysql_password
      - db_app_password
      - internal_api_secret
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init-db:
        condition: service_completed_successfully

  queue-worker-limits:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--queue=limits", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    secrets:
      - app_key
      - mysql_password
      - db_app_password
      - internal_api_secret
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init-db:
        condition: service_completed_successfully

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  db_data:

# ============================================================
# DOCKER SECRETS
# SECURITY: All secrets (wallet keys, API secrets, DB passwords) are mounted
# as files in /run/secrets/. They do NOT appear in `docker inspect`, `env`,
# or the container's environment block. The secret files live in .secrets/
# on the host (gitignored). security-entrypoint.sh + config.js readSecret()
# read from /run/secrets/ first, falling back to process.env for local dev.
# ============================================================
secrets:
  game_wallet_pk:
    file: ./.secrets/game_wallet_pk
  signer_wallet_pk:
    file: ./.secrets/signer_wallet_pk
  payout_operator_pk:
    file: ./.secrets/payout_operator_pk
  marketplace_wallet_pk:
    file: ./.secrets/marketplace_wallet_pk
  internal_api_secret:
    file: ./.secrets/internal_api_secret
  app_key:
    file: ./.secrets/app_key
  mysql_password:
    file: ./.secrets/mysql_password
  db_app_password:
    file: ./.secrets/db_app_password
  reverb_app_key:
    file: ./.secrets/reverb_app_key
  reverb_app_secret:
    file: ./.secrets/reverb_app_secret