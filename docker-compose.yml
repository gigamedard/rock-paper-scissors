services:

  # ============================================================
  # 1. BASE DE DONNÉES (MySQL)
  # ============================================================
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rock_paper_scissors
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # 3307 hôte pour ne pas entrer en conflit avec l'autre app (3306)
      # SECURITY: bind to loopback only (not 0.0.0.0)
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ============================================================
  # 2. CACHE & QUEUE (Redis)
  # ============================================================
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # 3. MIGRATIONS (One-shot — s'éteint après succès)
  # Utilise l'image app déjà buildée — pas de rebuild Composer.
  # ============================================================
  init-db:
    image: rock-paper-scissors-app:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /var/www/html &&
        echo "Attente de la base de données..." &&
        until php -r "new PDO('mysql:host=db;dbname=rock_paper_scissors', 'root', '${MYSQL_PASSWORD}');" 2>/dev/null; do sleep 2; done;
        echo "Base de données prête !" &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        echo '✅ Migrations terminées.'
    env_file: .env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # 4. BLOCKCHAIN (Hardhat + Deploy des Smart Contracts)
  # Image rebuildée avec le nouveau entrypoint.sh + deployed.txt
  # ============================================================
  blockchain:
    image: rock-paper-scissors-blockchain:latest
    restart: unless-stopped
    secrets:
      # SECURITY: keys mounted as files in /run/secrets/ (not in environment).
      # full_deploy.js reads them via config.js readSecret() which checks /run/secrets/ first.
      - game_wallet_pk
      - signer_wallet_pk
      - payout_operator_pk
    ports:
      # 8546 hôte pour ne pas entrer en conflit avec l'autre app (8545)
      # SECURITY: bind to loopback only (not 0.0.0.0)
      - "127.0.0.1:8546:8545"
    volumes:
      # Permet à full_deploy.js d'écrire les nouvelles adresses dans config.js (sur le host)
      - ./smart_contracts:/smart_contracts
    healthcheck:
      # Vérifie que le déploiement des contrats est terminé
      test: ["CMD", "test", "-f", "/app/deployed.txt"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # ============================================================
  # 5. BRIDGE NODE.JS (Listener Smart Contracts + API interne)
  # Démarre UNIQUEMENT après que blockchain soit healthy.
  # Reçoit les adresses fraîches via le volume partagé smart_contracts/
  # ============================================================
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: rock-paper-scissors-bridge:latest
    command: ["node", "smart_contracts/app.js"]
    restart: unless-stopped
    env_file: .env.staging
    secrets:
      # SECURITY: wallet keys mounted as files in /run/secrets/ (NOT in environment).
      # The bridge gets ONLY the hot keys: payout_operator (payOut/batchPayOut) and
      # signer (claim signatures). GAME_WALLET_PK (owner/cold key) is NOT here —
      # a bridge compromise cannot access admin functions.
      - payout_operator_pk
      - marketplace_wallet_pk
      - signer_wallet_pk
      - internal_api_secret
    volumes:
      # CRUCIAL : Monter UNIQUEMENT config.js (pas tout le dossier).
      # Monter tout smart_contracts/ écraserait les node_modules Linux avec ceux de Windows.
      # Les clés privées sont injectées via `secrets:` ci-dessus, PAS via un .env monté.
      - ./smart_contracts/config.js:/app/smart_contracts/config.js:ro
    depends_on:
      blockchain:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ============================================================
  # 6. APPLICATION LARAVEL (PHP + Nginx + Frontend)
  # Démarre après les migrations ET que le bridge soit ready
  # ============================================================
  app:
    build: .
    image: rock-paper-scissors-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8080"]
    ports:
      # 8001 hôte pour ne pas entrer en conflit avec l'autre app (8000)
      # SECURITY: bind to loopback only (not 0.0.0.0)
      - "127.0.0.1:8001:8080"
    env_file: .env.staging
    depends_on:
      init-db:
        condition: service_completed_successfully
      bridge:
        condition: service_healthy

  # ============================================================
  # 7. SERVEUR WEBSOCKET (Laravel Reverb)
  # Démarre après les migrations (il lit la table cache)
  # ============================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: rock-paper-scissors-reverb:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8008"]
    restart: unless-stopped
    ports:
      # SECURITY: bind to loopback only (not 0.0.0.0)
      - "127.0.0.1:8008:8008"
    env_file: .env.staging
    # Le serveur WebSocket Reverb est opérationnel (confirmé dans les logs).
    # Healthcheck via l'endpoint HTTP channels (retourne 200 si Reverb est up).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8008/apps/rps_app_id/channels?auth_key=${REVERB_APP_KEY}&auth_timestamp=9999999999&auth_signature=test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ============================================================
  # 8. WORKER BATCH (Node.js — Run Batch Processor)
  # DÉSACTIVÉ EN PROD : le tick client (/api/metrics/collect) remplace
  # ce worker. Décommenter uniquement pour les tests de simulation.
  # ============================================================
  # worker:
  #   image: rock-paper-scissors-worker:latest
  #   restart: unless-stopped
  #   env_file: .env.staging
  #   volumes:
  #     - ./smart_contracts/config.js:/app/smart_contracts/config.js:ro
  #     - ./smart_contracts/.env:/app/smart_contracts/.env:ro
  #   depends_on:
  #     bridge:
  #       condition: service_healthy

  # ============================================================
  # 9. QUEUE WORKER LARAVEL (Traitement des jobs async)
  # Dépend des migrations pour que les tables jobs/ batches existent
  # ============================================================
  queue-worker:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    # Healthcheck : vérifie qu'un processus queue:work tourne.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init-db:
        condition: service_completed_successfully

  # Dedicated worker for the 'limits' queue: prevents slow/failing blockchain
  # sync jobs (SyncUserLimitsJob) from blocking real-time broadcast events
  # (FightResult, UserBalanceUpdated, ...) on the 'default' queue.
  queue-worker-limits:
    image: rock-paper-scissors-app:latest
    command: ["php", "artisan", "queue:work", "--queue=limits", "--tries=3", "--timeout=90", "--sleep=3"]
    restart: unless-stopped
    env_file: .env.staging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init-db:
        condition: service_completed_successfully

# ============================================================
# VOLUMES PERSISTANTS (survivent aux docker-compose down)
# Pour tout effacer : docker-compose down -v
# ============================================================
volumes:
  db_data:

# ============================================================
# DOCKER SECRETS
# SECURITY: Wallet keys and API secrets are mounted as files in /run/secrets/
# inside the containers. They do NOT appear in `docker inspect`, `env`, or
# the container's environment block. The secret files live in .secrets/ on
# the host (gitignored). config.js readSecret() reads from /run/secrets/ first,
# falling back to process.env for local dev.
# ============================================================
secrets:
  game_wallet_pk:
    file: ./.secrets/game_wallet_pk
  signer_wallet_pk:
    file: ./.secrets/signer_wallet_pk
  payout_operator_pk:
    file: ./.secrets/payout_operator_pk
  marketplace_wallet_pk:
    file: ./.secrets/marketplace_wallet_pk
  internal_api_secret:
    file: ./.secrets/internal_api_secret
